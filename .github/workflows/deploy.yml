name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  deployments: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Start deployment
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production

      - name: Set up Node and build frontend
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install frontend deps and build assets
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          PHILSMS_API_TOKEN: ${{ secrets.PHILSMS_API_TOKEN }}
          PHILSMS_SENDER_ID: ${{ secrets.PHILSMS_SENDER_ID }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          protocol: tcp
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          envs: MAPBOX_ACCESS_TOKEN,PHILSMS_API_TOKEN,PHILSMS_SENDER_ID
          script: |
            set -euxo pipefail
            echo "==> deploy start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "==> php $(php -v | head -n 1)"
            echo "==> composer $(composer --version 2>/dev/null | head -n 1)"
            git config --global --add safe.directory '*'
            REPO_DIR="$HOME/raniag"
            mkdir -p "$REPO_DIR"
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "==> repo missing, cloning"
              rm -rf "$REPO_DIR"
              git clone https://github.com/joeryl69-rgb/raniag.git "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            echo "==> repo path: $(pwd)"
            git remote set-url origin https://github.com/joeryl69-rgb/raniag.git || true
            echo "==> git fetch/reset"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            mkdir -p public/build
            echo "==> composer (no scripts: Hostinger CLI blocks proc_open)"
            composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist --no-scripts
            echo "==> sync MAPBOX_ACCESS_TOKEN into production .env (idempotent, keeps everything else untouched)"
            if [ -n "${MAPBOX_ACCESS_TOKEN:-}" ] && [ -f .env ]; then
              if grep -q '^MAPBOX_ACCESS_TOKEN=' .env; then
                sed -i "s#^MAPBOX_ACCESS_TOKEN=.*#MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}#" .env
              else
                printf '\nMAPBOX_ACCESS_TOKEN=%s\n' "${MAPBOX_ACCESS_TOKEN}" >> .env
              fi
            fi
            echo "==> enable PhilSMS in production .env"
            set +x
            php -r 'file_put_contents("storage/framework/philsms-env.php", base64_decode(""));'
            php storage/framework/philsms-env.php
            rm -f storage/framework/philsms-env.php
            set -x
            echo "==> artisan"
            php artisan optimize:clear
            php artisan migrate --force
            php artisan storage:link || true
            php artisan raniag:migrate-private-files --no-interaction || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            echo "==> sms env check"
            php artisan raniag:sms-health || true
            echo "==> deploy done $(date -u +%Y-%m-%dT%H:%M:%SZ) at $(git rev-parse --short HEAD)"

      - name: Upload frontend build to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          source: "public/build/*"
          target: raniag/public/build
          strip_components: 2
          overwrite: true

      - name: Finish deployment
        uses: bobheadxi/deployments@v1
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: production
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env_url: https://mediumorchid-weasel-407759.hostingersite.com
