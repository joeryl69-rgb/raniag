name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  deployments: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Start deployment
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          protocol: tcp
          timeout: 60s
          command_timeout: 30m
          max_attempts: 3
          backoff: 8s
          script_stop: true
          script: |
            set -e
            echo "==> deploy start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            export PATH=/opt/alt/alt-nodejs24/root/usr/bin:$PATH
            cd ~/raniag
            echo "==> git fetch/reset"
            git fetch origin main
            git reset --hard origin/main
            echo "==> composer"
            composer install --no-dev --optimize-autoloader --no-interaction
            echo "==> npm"
            npm install --no-fund --no-audit
            npm run build
            echo "==> artisan"
            php artisan optimize:clear
            php artisan migrate --force
            php artisan storage:link || true
            php artisan raniag:migrate-private-files --no-interaction || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            echo "==> deploy done $(date -u +%Y-%m-%dT%H:%M:%SZ) at $(git rev-parse --short HEAD)"

      - name: Finish deployment
        uses: bobheadxi/deployments@v1
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: production
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env_url: https://mediumorchid-weasel-407759.hostingersite.com
